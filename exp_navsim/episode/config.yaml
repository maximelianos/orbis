# Single config for the whole exp_navsim pipeline.
# Subkeys separate the logic:
#   data_long  -> long (whole-episode) dataloader + visualization + caching source
#   cache      -> latent caching (encoder + output dir)
#   data       -> training data module (train/val), used by train_nuplan.py
#   model      -> flow-matching trajectory model
# The scripts (visualize_dataset / cache_latents / test_decode / test_model) read
# data_long and cache; training reads model + data.

# --------------------------------------------------------------------------- #
# Source dataset switch (episode loader + latent-cache source).
#   navhard  -> navhard_two_stage (short 5-frame scenes)
#   navtrain -> full NAVSIM navtrain logs (many long ~40-frame scenes @ 2 Hz)
# NavsimLongBase.from_config(cfg) reads this flag and picks the matching class +
# the matching `data_long.<name>` params below (explicit dispatch, no factory).
# --------------------------------------------------------------------------- #
dataset: navtrain

# --------------------------------------------------------------------------- #
# Long (whole-episode) dataloader params — one block per dataset; `dataset:`
# above selects which block is loaded into the corresponding dataset class.
# --------------------------------------------------------------------------- #
data_long:
  navhard:                        # -> exp_navsim.data.navsim_long.NavsimLongDataset
    data_root: /scratch/global/velikanm/navsim/download/navhard_two_stage  # navsim/download/navhard_two_stage
    size: 256                     # square image (H, W); downscaled by tokenizer
    stored_data_frame_rate: 2     # NAVSIM logs are ~2 Hz (0.5 s interval)
    frame_rate: 2                 # sampling rate; frame_interval = stored / rate
    front_camera: CAM_F0
    load_surround: true           # also load 5 surround cameras for BEV/vis
    # split: "all" = every episode (caching/visualization); "train"/"val" =
    #   deterministic hash-based split of the scene tokens (no overlap).
    split: all
    val_fraction: 0.1             # fraction of scene tokens assigned to validation

  navtrain:                       # -> exp_navsim.data.navtrain_long.NavtrainLongDataset
    logs_root: navsim/download/trainval_navsim_logs/trainval
    sensor_root: navsim/download/trainval_sensor_blobs/trainval
    # Episode index (scenes with contiguous on-disk frames) is built once and
    # cached here. Delete this file to rebuild after downloading more blobs.
    index_cache: data/navtrain_episode_index.pkl
    size: 256
    stored_data_frame_rate: 2
    frame_rate: 2
    front_camera: CAM_F0
    load_surround: true
    min_frames: 5                 # drop scenes with fewer usable (on-disk) frames
    split: all
    val_fraction: 0.1

# --------------------------------------------------------------------------- #
# Latent cache (image encoder). `dir` is keyed by dataset name.
# --------------------------------------------------------------------------- #
cache:
  dir:
    navhard:  data/navsim_latents    # one <episode_idx>.h5 per episode
    navtrain: data/navtrain_latents
  chunk: 100                     # frames per encoder forward pass
  encoder:
    exp_dir: logs_tk/tokenizer_288x512
    ckpt: checkpoints/last.ckpt
    config: config.yaml

# --------------------------------------------------------------------------- #
# Model
# --------------------------------------------------------------------------- #
model:
  base_learning_rate: 5.0e-4
  adjust_learning_rate: false
  precision: 16-mixed
  grad_acc_steps: 1
  resume_traj_ae_only: false        # --resume loads only traj_ae.* and traj_norm.*
  target: exp_navsim.episode.model.NavsimTrajectoryModel
  params:
    hidden_dim: 16
    # Channels of ONE stage-1 tokenizer latent. The aggregator reads both cached
    # latents (q_sem and q_rec concatenated), so its input is twice this.
    image_encoder_channels: 16
    sigma_min: 1.0e-5
    warmup_steps: 0
    min_lr_multiplier: 0.1
    # Episode length T is free; the model predicts the whole trajectory.
    context_images: 2               # image-observed context frames
    image_tokens: 64                 # tokens the spatial block extracts per observed frame
    ff_dim: 32                       # feed-forward width in the spatial and denoiser blocks
    num_heads: 2
    num_diffusion_steps: 10         # inference diffusion steps
    num_val_samples: 50              # inference repeats per context in validation
    # Future frames after frame 0 that are predicted, trained and scored
    # (8 = 4 s at 2 Hz). null = the whole episode.
    max_pred_len: 8

    # What the denoiser predicts (z):
    #   vae  -> latent of the trajectory autoencoder, block traj_ae
    #   poly -> polynomial coefficients of the positions, block traj_poly
    #   pure -> the normalized velocity of every frame, block traj_pure
    trajectory: vae

    # Trajectory autoencoder (exp_navsim/episode/trajectory_ae.py), trained jointly.
    traj_ae:
      hidden_dim: 16
      latent_dim: 4                  # size of z
      enc_layers: 2                  # transformer layers in the encoder
      dec_blocks: 3                  # FiLM MLP blocks in the decoder
      kl_weight: 1.0e-3              # VAE KL to N(0, 1)
      pos_weight: 1.0                # weight of the cumulative (position) error

    # Polynomial fit (exp_navsim/episode/trajectory_repr.py), no trainable weights.
    traj_poly:
      order: 2                       # z has 2 * order coefficients (x and y)
      time_scale: 10.0               # frames per unit of the polynomial's time

    # Raw trajectory (exp_navsim/episode/trajectory_repr.py): z has 2 * max_frames entries.
    traj_pure:
      max_frames: 64                 # longest episode the model can predict

    # Training-time perturbation of the image latents against memorization
    # (exp_navsim/episode/regularization.py). Off in validation and sampling. Set a
    # value to 0 to disable that part.
    regularization:
      cond_dropout: 0.              # zero a sample's whole image input
      mask_ratio: 0.               # zero this fraction of the H x W cells per frame
      noise_std: 0.                 # Gaussian noise, relative to each channel's std
    
    # raw vs encoded image input:
    #   encode_images: false -> read cached latents (data below must be latent)
    #   encode_images: true  -> read raw images, model loads the tokenizer
    encode_images: false
    tokenizer_exp_dir: logs_tk/tokenizer_288x512
    tokenizer_ckpt: checkpoints/last.ckpt
    tokenizer_config: config.yaml

# --------------------------------------------------------------------------- #
# Training data module (train_nuplan.py entry point)
#   Default: ENCODED mode (cached latents behind a buffer). For RAW mode, set
#   model.params.encode_images: true and swap the datasets for
#   exp_navsim.episode.latent_dataset.NavsimRawWindowDataset (see readme).
# --------------------------------------------------------------------------- #
check_val_every_n_epoch: 5

data:
  target: data.datamodule.DataModuleFromConfig
  params:
    batch_size: 100
    num_workers: 1
    # Episodes have different lengths when num_frames=0, so they are zero-padded
    # to the longest one in the batch; the true lengths ride along in
    # batch["metadata"]["length"] and mask the loss.
    collate_fn: exp_navsim.episode.collate.pad_collate

    train:
      target: exp_navsim.episode.buffer.BufferDataset
      params:
        dataset_length: 100000      # if null, use the source dataset's length
        initial_buffer_size: 100
        max_buffer_size: 20000
        replace_rate: 4
        replace_count: 10
        source_dataset:
          target: exp_navsim.episode.latent_dataset.NavsimLatentDataset
          params:
            cache_dir: data/navtrain_latents
            #cache_dir: data/navsim_latents  # navhard
            num_frames: 0           # window length; 0 = the whole episode (padded per batch)
            context_images: 2       # only these leading latents are read from disk; keep = model.context_images
            split: train            # see data_long.split note above
            val_fraction: 0.1
            latent_key: encoded_q_sem
            deterministic: false
            # Random start: each draw takes the images and trajectory from a
            # random frame to the end of the episode, keeping >= this many frames
            # (12 = 6 s at 2 Hz). 0 = always start at frame 0. Training only;
            # validation is deterministic and always starts at 0.
            random_start_min_frames: 12

    validation:
      target: exp_navsim.episode.latent_dataset.NavsimLatentDataset
      params:
        cache_dir: data/navtrain_latents
        #cache_dir: data/navsim_latents  # navhard
        num_frames: 0                # 0 = the whole episode (padded per batch)
        context_images: 2            # keep = model.context_images
        split: train
        val_fraction: 0.1
        latent_key: encoded_q_sem
        deterministic: true          # fixed windows -> same test episodes each time

# --------------------------------------------------------------------------- #
# RAW MODE (encode-on-the-fly). To use it instead of the cached-latent `data`
# block above: set model.params.encode_images: true, then replace the whole
# `data:` block with `data_raw:` renamed to `data:` (batches carry `images`, and
# the model loads the tokenizer). No latent cache needed. Same window length
# (num_frames) and train/val split as the encoded path.
# --------------------------------------------------------------------------- #

