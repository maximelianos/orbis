# =========================================================================== #
#   # ONCE: cache at the world model's resolution (288x512 -> 18x32 latents).
#   PYTHONPATH=. python -m exp_navsim.data.cache_latents --config exp_navsim/wm/config.yaml
#
#   PYTHONPATH=. python train_nuplan.py -c exp_navsim/wm/config.yaml \
#       --max_steps 20000 --logdir logs_navsim_wm
#
#   PYTHONPATH=. python -m exp_navsim.test_model --config exp_navsim/wm/config.yaml \
#       --ckpt logs_navsim_wm --num 5
# =========================================================================== #
#
# World-model probe: exp_navsim/config.yaml's model, conditioned on the outputs
# of frozen Orbis backbone blocks (WM_BLOCKS in wm/wm_runner.py) at the
# next-frame slot, instead of on tokenizer latents. The observed frames go into
# the backbone but their tokens are not passed to the probe.
#
# wm_exp_dir must hold checkpoints/last.ckpt AND the config.yaml it was trained
# with. The Swin backbone only takes its own 18x32 grid, hence the 288x512 cache.

dataset: navtrain

data_long:
  navhard:
    data_root: /scratch/global/velikanm/navsim/download/navhard_two_stage
    size: [288, 512]
    stored_data_frame_rate: 2
    frame_rate: 2
    front_camera: CAM_F0
    load_surround: true
    split: all
    val_fraction: 0.1

  navtrain:
    logs_root: navsim/download/trainval_navsim_logs/trainval
    sensor_root: navsim/download/trainval_sensor_blobs/trainval
    index_cache: data/navtrain_episode_index.pkl
    size: [288, 512]
    stored_data_frame_rate: 2
    frame_rate: 2
    front_camera: CAM_F0
    load_surround: true
    min_frames: 5
    split: all
    val_fraction: 0.1

cache:
  dir:
    navhard:  data/navsim_latents_288x512
    navtrain: data/navtrain_latents_288x512
  chunk: 100
  encoder:
    exp_dir: logs_tk/tokenizer_288x512
    ckpt: checkpoints/last.ckpt
    config: config.yaml

# image_encoder_channels is derived from the world model's config.
model:
  base_learning_rate: 5.0e-4
  adjust_learning_rate: false
  precision: 16-mixed
  grad_acc_steps: 1
  resume_traj_ae_only: false        # --resume loads only traj_ae.* and traj_norm.*
  target: exp_navsim.wm.model.WmTrajectoryModel
  params:
    hidden_dim: 16
    sigma_min: 1.0e-5
    warmup_steps: 0
    min_lr_multiplier: 0.1
    context_images: 4               # observed frames fed to the world model; the probe sees only the next-frame slot
    image_tokens: 64
    ff_dim: 32
    num_heads: 2
    num_diffusion_steps: 10
    num_val_samples: 50
    max_pred_len: 8                 # future frames after frame 0; null = the whole episode

    trajectory: poly                 # vae | poly | pure, see exp_navsim/config.yaml
    
    traj_ae:
      hidden_dim: 16
      latent_dim: 4
      enc_layers: 2
      dec_blocks: 3
      kl_weight: 1.0e-3
      pos_weight: 1.0
    
    traj_poly:
      order: 2
      time_scale: 10.0
    traj_pure:
      max_frames: 64

    regularization:
      cond_dropout: 0.
      mask_ratio: 0.
      noise_std: 0.

    wm_exp_dir: logs_wm/orbis_288x512
    wm_ckpt: checkpoints/last.ckpt
    wm_config: config.yaml
    wm_use_ema: true
    wm_frame_rate: null             # null = the dataset's own rate (2 Hz)

check_val_every_n_epoch: 5

data:
  target: data.datamodule.DataModuleFromConfig
  params:
    batch_size: 100                  # the frozen backbone runs on every batch
    num_workers: 2
    collate_fn: exp_navsim.data.collate.pad_collate

    train:
      target: exp_navsim.data.buffer.BufferDataset
      params:
        dataset_length: 100000
        initial_buffer_size: 100
        max_buffer_size: 20000
        replace_rate: 4
        replace_count: 10
        source_dataset:
          target: exp_navsim.data.latent_dataset.NavsimLatentDataset
          params:
            cache_dir: data/navtrain_latents_288x512
            num_frames: 0
            context_images: 4       # keep = model.params.context_images
            split: train
            val_fraction: 0.1
            latent_key: encoded_q_sem
            deterministic: false
            random_start_min_frames: 12

    validation:
      target: exp_navsim.data.latent_dataset.NavsimLatentDataset
      params:
        cache_dir: data/navtrain_latents_288x512
        num_frames: 0
        context_images: 4
        split: val
        val_fraction: 0.1
        latent_key: encoded_q_sem
        deterministic: true
